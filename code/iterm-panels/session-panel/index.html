<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sessions</title>
<style>
  /* The app's design tokens (colour, type, radius, motion) — the same values the Clipboard panel
     draws with, so the two side panels read as one tool. Colour only where a session needs a look
     or has news (colour is a signal, never decoration): amber needs you or has stalled, blue is in
     progress, green finished since you last opened it, grey is finished and seen. Every icon has its
     state in words beside it — the section it sits in, and a word in the row when it is the exception. */
  :root {
    --bg: #eef1f6; --surface: #ffffff; --surface2: #f4f6f9; --surface3: #eaeef4;
    --text: #0b1220; --text3: #465366; --text4: #5b6675;
    --border: #c9d0db; --border2: #d8dee7; --border3: #aeb7c6; --field-line: #7d889a;
    --brand: #1d47a8; --brand-hover: #173a8c; --on-brand: #ffffff;
    --amber: #b45309; --amber-solid: #d97706; --amber-bg: #fdeed0; --amber-border: #eec163;
    --green: #047857; --green-solid: #059669;
    --blue-solid: #1d4ed8; --gray-solid: #8494ab; --gray-border: #ccd3dd;
    --red: #b91c1c; --on-red: #ffffff; --on-solid: #ffffff;
    --ease-out: cubic-bezier(0, 0, 0, 1); --dur-fast: 150ms;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e14; --surface: #161b22; --surface2: #1c2128; --surface3: #21262d;
      --text: #e6edf3; --text3: #b1bac4; --text4: #8b949e;
      --border: #3a424c; --border2: #2a3038; --border3: #4f5866; --field-line: #6e7681;
      --brand: #7c9df2; --brand-hover: #93aff5; --on-brand: #0f1216;
      --amber: #f59e0b; --amber-solid: #f59e0b; --amber-bg: rgba(245, 158, 11, .1); --amber-border: rgba(245, 158, 11, .25);
      --green: #22c55e; --green-solid: #10b981;
      --blue-solid: #3b82f6; --gray-solid: #6b7280; --gray-border: rgba(107, 114, 128, .2);
      --red: #f87171; --on-red: #0f1216; --on-solid: #0f1216;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e14; --surface: #161b22; --surface2: #1c2128; --surface3: #21262d;
    --text: #e6edf3; --text3: #b1bac4; --text4: #8b949e;
    --border: #3a424c; --border2: #2a3038; --border3: #4f5866; --field-line: #6e7681;
    --brand: #7c9df2; --brand-hover: #93aff5; --on-brand: #0f1216;
    --amber: #f59e0b; --amber-solid: #f59e0b; --amber-bg: rgba(245, 158, 11, .1); --amber-border: rgba(245, 158, 11, .25);
    --green: #22c55e; --green-solid: #10b981;
    --blue-solid: #3b82f6; --gray-solid: #6b7280; --gray-border: rgba(107, 114, 128, .2);
    --red: #f87171; --on-red: #0f1216; --on-solid: #0f1216;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  button:disabled { cursor: default; opacity: .5; }
  .btn-primary { background: var(--brand); color: var(--on-brand); border: 1px solid var(--brand); }
  .btn-primary:not(:disabled):hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn-secondary { background: var(--surface); border: 1px solid var(--border3); }
  .btn-secondary:hover { background: var(--surface3); }
  .btn-danger { background: var(--red); color: var(--on-red); border: 1px solid var(--red); }
  .sm { padding: 1px 8px; font-size: 12px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* An icon button: its title is its name and its tip. */
  .icon { width: 24px; height: 24px; padding: 0; border: none; background: none; color: var(--text4); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon svg { width: 14px; height: 14px; }
  .icon:hover { background: var(--border2); color: var(--text); }

  /* The top: the New session box, always there like Clipboard's Search, and the panel's ⋯ menu. */
  .top { position: sticky; top: 0; z-index: 3; background: var(--bg); display: flex; gap: 6px; align-items: flex-start; padding: 8px; }
  #compose { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--field-line); border-radius: 6px; }
  #compose:focus-within { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  #compose.drop { border-color: var(--brand); border-style: dashed; }
  #prompt { display: block; width: 100%; height: 26px; max-height: 168px; border: none; background: none; resize: none; padding: 4px 8px; line-height: 18px; outline: none; }
  #prompt::placeholder { color: var(--text4); }
  .tools { display: none; align-items: center; gap: 6px; padding: 4px 4px 4px 6px; border-top: 1px solid var(--border2); min-width: 0; }
  #compose.open .tools { display: flex; }
  .tools select { min-width: 0; max-width: 45%; background: var(--surface); border: 1px solid var(--border3); border-radius: 6px; padding: 1px 4px; font-size: 12px; }
  .tools .err { flex: 1; min-width: 0; color: var(--red); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 8px 6px; }
  .pics:empty { display: none; }
  .pic { position: relative; }
  .pic img { display: block; width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border2); }
  .pic button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border3); display: flex; align-items: center; justify-content: center; }
  .pic button svg { width: 10px; height: 10px; }

  .menu-wrap { position: relative; flex: none; }
  #menu-btn { width: 28px; height: 28px; padding: 0; font-weight: 400; }
  .menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 5; min-width: 170px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, .28); }
  .menu-h { padding: 2px 6px 4px; font-size: 12px; color: var(--text4); }
  .menu label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; white-space: nowrap; cursor: pointer; }
  .menu label:hover { background: var(--surface3); }
  .notice { margin: 0 8px 8px; padding: 6px 10px; border-radius: 9px; background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); font-size: 12px; }

  /* Needs you, then one card per parallel run, then Working and Finished for sessions started by hand. */
  .card { margin: 0 8px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .band { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--surface2); border-bottom: 1px solid var(--border2); font-size: 12px; font-weight: 600; }
  .band .n { margin-left: auto; color: var(--text4); font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .band .warn { color: var(--amber); font-weight: 600; }
  .band .new { color: var(--green); font-weight: 600; }
  .band .gname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.band { width: 100%; border: none; border-radius: 0; text-align: left; color: inherit; }
  button.band:hover { background: var(--surface3); }
  .card.shut .band { border-bottom: none; }
  .caret { width: 12px; height: 12px; color: var(--text4); transition: transform var(--dur-fast) var(--ease-out); }
  .card:not(.shut) .caret { transform: rotate(90deg); }
  .card.needs { border-color: var(--amber-border); }
  .card.needs .band { background: var(--amber-bg); border-bottom-color: var(--amber-border); color: var(--amber); }
  .card.needs .band .n { color: var(--amber); font-weight: 600; }

  .row {
    --row-bg: var(--surface);
    position: relative; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 8px; align-items: center;
    grid-template-areas: "lead title right" ". line line" ". run run" ". opts opts" ". ask ask";
    padding: 7px 12px; background: var(--row-bg); cursor: pointer; border-top: 1px solid var(--border2);
  }
  .band + .row { border-top: none; }
  .row:hover { --row-bg: var(--surface3); }
  .row.open { --row-bg: color-mix(in srgb, var(--brand) 13%, var(--surface)); box-shadow: inset 3px 0 0 var(--brand); }
  .row.static { cursor: default; }
  .row.busy { opacity: .55; pointer-events: none; }
  .title { grid-area: title; display: flex; align-items: center; gap: 4px; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .right { grid-area: right; display: flex; align-items: center; gap: 6px; }
  .meta { font-size: 12px; color: var(--text4); white-space: nowrap; display: flex; gap: 5px; align-items: center; font-variant-numeric: tabular-nums; }
  .meta .warn { color: var(--amber); font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 5px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .chip { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .line { grid-area: line; font-size: 12px; color: var(--text4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .run { grid-area: run; font-size: 12px; color: var(--text4); overflow: hidden; margin-top: 1px; font-variant-numeric: tabular-nums; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .k-stalled .run { color: var(--amber); }
  .k-needs .line { color: var(--text3); white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  /* Finished and seen steps back; finished since you last opened it keeps full weight beside its green mark. */
  .k-done:not(.fresh) .name, .k-idle:not(.fresh) .name { color: var(--text3); font-weight: 500; }
  .badge { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 9999px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--text3); background: var(--surface3); border: 1px solid var(--gray-border); }

  /* The state mark. Working spins (transform only, so it costs nothing); everything else holds still. */
  .ico { width: 12px; height: 12px; border-radius: 9999px; justify-self: center; display: flex; align-items: center; justify-content: center; }
  .ico.needs { width: 10px; height: 10px; background: var(--amber-solid); box-shadow: 0 0 0 3px var(--amber-bg); }
  .ico.spin { border: 2px solid color-mix(in srgb, var(--blue-solid) 25%, transparent); border-top-color: var(--blue-solid); animation: spin 1s linear infinite; }
  .ico.ring { border: 2px solid var(--gray-solid); }
  .ico.ring.warn { border-color: var(--amber-solid); }
  .ico.ring.blue { border-color: var(--blue-solid); }
  .ico.done { color: var(--gray-solid); }
  .ico.done svg { width: 12px; height: 12px; stroke-width: 1.9; }
  .fresh .ico.done { background: var(--green-solid); color: var(--on-solid); }
  .fresh .ico.done svg { width: 9px; height: 9px; stroke-width: 2.2; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Close and Rename sit on the left, where the pointer already is: on hover or keyboard focus the ×
     takes the state mark's place, the way Safari shows a tab's close, and the pencil comes in after
     the name. At rest the row is only its name, its facts and where it stands. */
  .lead { grid-area: lead; position: relative; width: 12px; height: 12px; justify-self: center; }
  .lead .close { position: absolute; left: -6px; top: -6px; }
  .close:hover { color: var(--red); }
  .row .close, .row .pencil { visibility: hidden; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out), visibility 0s linear var(--dur-fast); }
  .row:hover .close, .row:focus-within .close, .row:hover .pencil, .row:focus-within .pencil { visibility: visible; opacity: 1; transition-delay: 0s; }
  .row:hover .lead .ico, .row:focus-within .lead .ico { visibility: hidden; }
  .pencil { width: 22px; height: 22px; }
  .pencil svg { width: 13px; height: 13px; }

  .rename-box { flex: 1; max-width: 340px; min-width: 0; height: 20px; background: var(--surface); border: 1px solid var(--brand); border-radius: 6px; padding: 0 6px; font-weight: 600; }
  .rename-box:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--brand); }
  .ask { grid-area: ask; margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border2); font-size: 12px; color: var(--text3); cursor: default; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .ask b { color: var(--text); }
  .ask .actions { display: flex; gap: 6px; }
  .ask.err { color: var(--red); }
  .opts { grid-area: opts; list-style: none; margin: 3px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text3); min-width: 0; }
  .opts li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .opts .num { flex: none; color: var(--amber); font-weight: 600; }
  .opts .opt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { margin: 16px 8px; color: var(--text4); font-size: 12px; text-align: center; }

  /* A narrow panel: the facts keep the time and the run's colour, and drop the run's name. */
  @media (max-width: 340px) {
    .tag .tname, .tag + .dotsep { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ico.spin { animation: none; }
    .close, .pencil, .caret { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="menu-wrap">
    <button type="button" class="btn-secondary" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Panel settings" title="Panel settings">⋯</button>
    <div class="menu" id="menu" hidden>
      <div class="menu-h">Open sessions</div>
      <label><input type="radio" name="mode" value="one"> In one tab</label>
      <label><input type="radio" name="mode" value="tabs"> In a tab each</label>
    </div>
  </div>
  <form id="compose" autocomplete="off">
    <textarea id="prompt" rows="1" placeholder="New session" aria-label="New session: what it should do" spellcheck="true"></textarea>
    <div class="pics" id="pics"></div>
    <div class="tools">
      <button type="submit" class="btn-primary sm" id="start" title="Start session (↵)" aria-keyshortcuts="Enter" disabled>Start</button>
      <select id="folder" aria-label="Folder" title="Folder it starts in"></select>
      <button type="button" class="icon" id="paste" title="Paste text or a picture" aria-label="Paste text or a picture"><svg viewBox="0 0 16 16"><rect x="4" y="3" width="8" height="11" rx="1.5"/><path d="M6.5 3V2.5a1.5 1.5 0 0 1 3 0V3"/></svg></button>
      <span class="err" id="msg" role="status"></span>
    </div>
  </form>
</header>
<div id="notice"></div>
<main id="list"></main>

<script>
  const KEY = '__PANEL_KEY__';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plain = (t) => String(t ?? '').replace(/\*\*|__|`/g, ''); // a session's markdown, read as words
  const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const took = (ms) => { const m = Math.floor((Date.now() - ms) / 60000); return m < 1 ? 'under a minute' : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`; };
  const rgb = (c) => (Array.isArray(c) ? `rgb(${c[0]},${c[1]},${c[2]})` : 'var(--gray-solid)');
  const SVG = {
    check: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 6.3 4.9 8.6 9.4 3.6"/></svg>',
    pencil: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.9a1.6 1.6 0 0 1 2.3 2.3L5.6 12.5 2.5 13.5l1-3.1z"/><path d="M9.5 4l2.5 2.5"/></svg>',
    x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
    caret: '<svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.75 7.75 6 4.5 9.25"/></svg>',
  };

  function load(key, fallback) {
    try { const v = localStorage.getItem('panel.' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('panel.' + key, JSON.stringify(value)); } catch { /* storage blocked: it just won't stick */ }
  }

  let state = null;
  let pageVersion = null;
  let lastDrawn = '';
  // Where a click opens a session: 'one' = the same tab every time (like agent view), 'tabs' = a tab each.
  let mode = load('mode', 'one');
  const shut = load('shut', {});              // folded cards: { working: true, finished: true }
  const lastSeen = load('lastSeen', {});      // job → the card it was in at the last draw
  const fresh = new Set(load('fresh', []));   // finished since you last opened them
  const busy = new Set();
  let confirming = null; // the session whose Close is asking "end it?" in its row
  let renaming = null;   // { job, value, error } — the session whose name is being edited in its row
  let pressing = false;  // a redraw under a pressed mouse would swallow the click

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Panel-Key': KEY }, body: JSON.stringify(body) });
    return r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
  }

  function notice(text) { $('notice').innerHTML = text ? `<div class="notice">${esc(text)}</div>` : ''; }

  async function tick() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      state = await r.json();
      if (state.page && pageVersion && state.page !== pageVersion) {
        // New session's draft comes back after the reload; so does the cursor, if you were typing there.
        keepDraft(document.hasFocus() && document.activeElement === prompt ? { caret: [prompt.selectionStart, prompt.selectionEnd] } : {});
        return location.reload();
      }
      pageVersion = pageVersion || state.page;
      notice(state.error ? `Not refreshed — ${state.error}` : '');
    } catch {
      notice('List paused — panel service restarting');
      return;
    }
    draw();
  }

  // What each session is, in the panel's words. A run's orchestrator that has handed its work out
  // sits idle while its run is busy; it is shown as working, waiting on its run, not as finished.
  const LIVE = new Set(['working', 'shell', 'waiting']);
  const PHASE = { needs: 'needs', working: 'working', shell: 'working', stalled: 'working', leading: 'working', done: 'finished', idle: 'finished' };
  const WORD = { needs: 'Needs you', working: 'Working', shell: 'Running a command', stalled: 'Stalled', leading: 'Waiting on its run', done: 'Done', idle: 'Idle' };
  function kindOf(s, g) {
    const x = { s, g, kind: s.state === 'done' ? 'done' : 'idle' };
    if (s.state === 'waiting') x.kind = 'needs';
    else if (s.state === 'working' || s.state === 'shell') x.kind = s.stalled ? 'stalled' : s.state;
    else if (s.lead && g.run) {
      x.helpers = g.sessions.filter((o) => o !== s && LIVE.has(o.state)).length;
      if (x.helpers) x.kind = 'leading';
    }
    return x;
  }
  // Needs you takes every session asking something. A parallel run keeps its own card, orchestrator
  // first; the sessions started by hand go to Working or Finished. Newest first inside each.
  function classify() {
    const out = { all: [], needs: [], runs: [], working: [], finished: [] };
    for (const g of state.groups) {
      const xs = g.sessions.map((s) => kindOf(s, g));
      out.all.push(...xs);
      out.needs.push(...xs.filter((x) => x.kind === 'needs'));
      const rest = xs.filter((x) => x.kind !== 'needs');
      if (g.run) { if (rest.length) out.runs.push({ run: g.run, colour: g.colour, list: rest }); }
      else for (const x of rest) out[PHASE[x.kind]].push(x);
    }
    const newest = (a, b) => (b.s.at || 0) - (a.s.at || 0) || a.s.label.localeCompare(b.s.label);
    const rank = (x) => (x.kind === 'stalled' ? 0 : PHASE[x.kind] === 'working' ? 1 : 2);
    out.needs.sort(newest);
    out.working.sort((a, b) => rank(a) - rank(b) || newest(a, b));
    out.finished.sort(newest);
    for (const r of out.runs) r.list.sort((a, b) => b.s.lead - a.s.lead || rank(a) - rank(b) || newest(a, b));
    // Runs still going before runs that are done, by name inside each, so a card stays where it is.
    const over = (r) => r.list.every((x) => PHASE[x.kind] === 'finished');
    out.runs.sort((a, b) => over(a) - over(b) || a.run.localeCompare(b.run));
    return out;
  }

  // A session that moves into Finished while the panel watches is news until you open it.
  function track(all) {
    const now = {};
    for (const x of all) now[x.s.job] = PHASE[x.kind];
    let changed = false;
    for (const [job, card] of Object.entries(now)) {
      if (card === 'finished' && lastSeen[job] && lastSeen[job] !== 'finished' && !fresh.has(job)) { fresh.add(job); changed = true; }
      if (card !== 'finished' && fresh.delete(job)) changed = true;
      if (lastSeen[job] !== card) { lastSeen[job] = card; changed = true; }
    }
    for (const job of Object.keys(lastSeen)) if (!(job in now)) { delete lastSeen[job]; fresh.delete(job); changed = true; }
    if (changed) { save('lastSeen', lastSeen); save('fresh', [...fresh]); }
  }

  function mark(x) {
    // A negative delay keeps every spinner on the clock, so a redraw doesn't snap it back to the top.
    if (x.kind === 'working' || x.kind === 'shell') return `<span class="ico spin" style="animation-delay:-${Date.now() % 1000}ms" aria-hidden="true"></span>`;
    if (x.kind === 'needs') return '<span class="ico needs" aria-hidden="true"></span>';
    if (x.kind === 'stalled') return '<span class="ico ring warn" aria-hidden="true"></span>';
    if (x.kind === 'leading') return '<span class="ico ring blue" aria-hidden="true"></span>';
    if (x.kind === 'done' || fresh.has(x.s.job)) return `<span class="ico done" aria-hidden="true">${SVG.check}</span>`;
    return '<span class="ico ring" aria-hidden="true"></span>';
  }

  // The facts: which run or folder it belongs to, and how long it has been where it stands. The state
  // word shows only when it is the exception in its card.
  function facts(x, inRun) {
    const { s, g } = x;
    const hand = /^(.*) · started by hand$/.exec(g.title);
    const where = inRun ? '' : g.run
      ? `<span class="tag" title="Run: ${esc(g.run)}"><span class="chip" style="background:${rgb(g.colour)}"></span><span class="tname">${esc(g.run)}</span></span>`
      : `<span class="tag" title="Started by hand in ${esc(hand ? hand[1] : g.title)}"><span class="tname">${esc(hand ? hand[1] : g.title)}</span></span>`;
    const when = {
      stalled: `<span class="warn">Stalled ${esc(s.quiet)}</span>`,
      shell: `Running ${esc(s.ago)}`,
      leading: `<span title="${x.helpers} of its run's sessions still going">Waiting on ${x.helpers}</span>`,
      idle: `Idle ${esc(s.ago)}`,
    }[x.kind] || esc(s.ago);
    return `<span class="meta">${where ? `${where}<span class="dotsep" aria-hidden="true">·</span>` : ''}<span>${when}</span></span>`;
  }

  function row(x, inRun) {
    const { s, kind } = x;
    const attachable = !s.kind || s.kind === 'bg';
    const finished = PHASE[kind] === 'finished';
    const editing = renaming?.job === s.job;
    const asking = confirming === s.job;
    const detail = plain(kind === 'needs' ? (s.questions[0]?.question || s.now || s.about) : ((s.echo ? s.about : s.now) || s.about));
    // The command it is in, so a long wait reads differently from a hang: for how long, and when it gives up if it says.
    const cmd = s.running && (kind === 'shell' || kind === 'stalled') ? s.running : null;
    const running = cmd ? `${plain(cmd.text)} · ${took(cmd.since)}${cmd.until ? ` · gives up ${clock(cmd.until)}` : ''}` : '';
    const options = kind === 'needs' ? (s.questions[0]?.options || []).map(plain) : [];
    const tip = !attachable ? 'Runs in its own terminal tab'
      : mode === 'one' ? (s.open ? 'Showing in the Sessions tab' : 'Show it in the Sessions tab')
      : (s.open ? 'Go to its tab' : 'Open in a tab');
    const actionable = attachable && !editing && !asking;
    const title = editing
      ? `<input class="rename-box" data-rename-input maxlength="60" value="${esc(renaming.value)}" aria-label="New name"${busy.has(s.job) ? ' disabled' : ''}>${busy.has(s.job) ? ''
        : '<button type="button" class="btn-primary sm" data-do-rename>Save</button><button type="button" class="btn-secondary sm" data-keep>Cancel</button>'}`
      : `<span class="name">${esc(s.label)}</span>${actionable && kind !== 'needs'
        ? `<button type="button" class="icon pencil" data-rename="${esc(s.job)}" data-label="${esc(s.label)}" aria-label="Rename ${esc(s.label)}" title="Rename">${SVG.pencil}</button>` : ''}`;
    const right = editing && busy.has(s.job) ? '<span class="meta">Renaming…</span>' : facts(x, inRun);
    const close = actionable
      ? `<button type="button" class="icon close" data-close="${esc(s.job)}" data-finished="${finished ? 1 : ''}" aria-label="Close ${esc(s.label)}" title="${finished ? 'Close' : 'End and close'}">${SVG.x}</button>` : '';
    return `
      <div class="row k-${kind} ${fresh.has(s.job) ? 'fresh' : ''} ${s.open ? 'open' : ''} ${attachable ? '' : 'static'} ${busy.has(s.job) ? 'busy' : ''}"
           ${attachable && !editing ? `role="button" tabindex="0" data-job="${esc(s.job)}"` : ''}
           data-run="${esc(x.g.run || '')}" data-colour="${esc(JSON.stringify(x.g.colour || null))}" title="${esc(tip)}">
        <span class="lead">${mark(x)}${close}</span>
        <span class="title"><span class="sr">${WORD[kind]}${fresh.has(s.job) ? ', new' : ''}:</span>${title}</span>
        <span class="right">${right}</span>
        <div class="line" title="${esc(detail)}">${s.lead ? '<span class="badge">Orchestrator</span>' : ''}${esc(detail)}</div>
        ${running ? `<div class="run" title="${esc(running)}">${esc(running)}</div>` : ''}
        ${options.length ? `<ol class="opts">${options.map((o, i) => `<li><span class="num">${i + 1}</span><span class="opt" title="${esc(o)}">${esc(o)}</span></li>`).join('')}</ol>` : ''}
        ${asking ? `<div class="ask" role="group" aria-label="End ${esc(s.label)}?">
          <span><b>End this session?</b> Its conversation and unpushed work are kept.</span>
          <span class="actions"><button type="button" class="btn-danger sm" data-do-close="${esc(s.job)}">End session</button><button type="button" class="btn-secondary sm" data-keep>Keep</button></span>
        </div>` : ''}
        ${editing && renaming.error ? `<div class="ask err" role="status">${esc(renaming.error)}</div>` : ''}
      </div>`;
  }

  function card(key, title, list, inRun = false) {
    if (!list.length) return '';
    const rows = () => list.map((x) => row(x, inRun)).join('');
    if (key === 'needs') {
      return `<section class="card needs"><div class="band">${title}<span class="n">${list.length}</span></div>${rows()}</section>`;
    }
    // A folded card still says what in it needs a look or is new, so nothing hides behind the fold.
    const folded = !!shut[key];
    const stalled = list.filter((x) => x.kind === 'stalled').length;
    const news = list.filter((x) => fresh.has(x.s.job)).length;
    const extra = [stalled ? `<span class="warn">${stalled} stalled</span>` : '', news ? `<span class="new">${news} new</span>` : ''].filter(Boolean);
    return `<section class="card ${folded ? 'shut' : ''}">
      <button type="button" class="band" data-fold="${esc(key)}" aria-expanded="${!folded}">${SVG.caret}${title}
        <span class="n">${[...extra, list.length].join(' · ')}</span>
      </button>${folded ? '' : rows()}</section>`;
  }

  function drawFolders() {
    const sel = $('folder');
    const want = state.folders.join('\n');
    if (sel.dataset.list === want) return;
    const keep = sel.value || draft.folder;
    sel.dataset.list = want;
    sel.innerHTML = state.folders.map((f) => {
      const short = f.replace(/^\/Users\/[^/]+/, '~');
      return `<option value="${esc(f)}" title="${esc(short)}">${esc(short === '~' ? '~' : short.split('/').pop())}</option>`;
    }).join('');
    if (state.folders.includes(keep)) sel.value = keep;
  }

  function draw() {
    if (!state || pressing) return;
    const cards = classify();
    track(cards.all);
    const key = JSON.stringify([cards.needs, cards.runs, cards.working, cards.finished, [...fresh], shut, [...busy], mode, confirming, renaming?.job, renaming?.error]);
    if (key === lastDrawn) return;
    lastDrawn = key;
    drawFolders();

    // A redraw mid-rename puts the cursor back in the name box, and only while the panel has the
    // keyboard. Nothing else is refocused: focus() here takes the keyboard from whatever you are typing
    // in (iTerm2 hands it to the side panel), and a row holding focus turns your next Space into a
    // click on it — on 2026-10-16 that reopened a session every few seconds and blanked its tab.
    const a = document.activeElement;
    const typing = document.hasFocus() && a?.matches('[data-rename-input]') ? [a.selectionStart, a.selectionEnd] : null;
    const runCard = (r) => card(`run:${r.run}`, `<span class="chip" style="background:${rgb(r.colour)}"></span><span class="gname">${esc(r.run)}</span>`, r.list, true);
    $('list').innerHTML = card('needs', 'Needs you', cards.needs) + cards.runs.map(runCard).join('')
      + card('working', 'Working', cards.working) + card('finished', 'Finished', cards.finished)
      || '<div class="empty">No sessions</div>';
    const box = typing && $('list').querySelector('[data-rename-input]');
    if (box) { box.focus(); box.setSelectionRange(...typing); }
  }
  function redraw() { lastDrawn = ''; draw(); }
  document.addEventListener('pointerdown', () => { pressing = true; });
  document.addEventListener('pointerup', () => { pressing = false; setTimeout(draw, 0); });

  async function saveRename() {
    const { job, value } = renaming;
    busy.add(job); redraw();
    try {
      const res = await post('/api/rename', { job, name: value });
      renaming = res.ok ? null : { job, value, error: res.message || res.error };
    } finally { busy.delete(job); redraw(); tick(); }
  }

  async function closeSession(job) {
    confirming = null; busy.add(job); redraw();
    try {
      const res = await post('/api/close', { job });
      // rm says just "removed <id>" when all went to plan; anything else (a worktree it kept) is worth reading.
      if (!res.ok) notice(`Not closed — ${res.message || res.error}`);
      else if (res.message && !/^removed\b/.test(res.message)) notice(res.message);
    } finally { busy.delete(job); redraw(); tick(); }
  }

  async function openRow(el) {
    const job = el.dataset.job;
    if (!job || busy.has(job)) return;
    if (fresh.delete(job)) save('fresh', [...fresh]);
    busy.add(job); redraw();
    try {
      const res = await post('/api/open', { job, mode, run: el.dataset.run || null, colour: JSON.parse(el.dataset.colour || 'null') });
      if (!res.ok) notice(`Not opened — ${res.message || res.error}`);
    } finally { busy.delete(job); redraw(); tick(); }
  }

  $('list').addEventListener('click', (e) => {
    const fold = e.target.closest('[data-fold]');
    if (fold) { shut[fold.dataset.fold] = !shut[fold.dataset.fold]; save('shut', shut); return redraw(); }
    // Closing a finished session is routine — its conversation and work are kept — so it goes at once.
    // Closing one that is still going ends it, so that asks first, in the row: a confirm() pop-up may
    // never show in iTerm2's side panel.
    const ask = e.target.closest('[data-close]');
    if (ask) {
      renaming = null;
      if (ask.dataset.finished) return closeSession(ask.dataset.close);
      confirming = ask.dataset.close; return redraw();
    }
    if (e.target.closest('[data-keep]')) { confirming = null; renaming = null; return redraw(); }
    const rn = e.target.closest('[data-rename]');
    if (rn) {
      renaming = { job: rn.dataset.rename, value: rn.dataset.label }; confirming = null; redraw();
      const box = $('list').querySelector('[data-rename-input]');
      box?.focus(); box?.select();
      return;
    }
    if (e.target.closest('[data-do-rename]')) return saveRename();
    const close = e.target.closest('[data-do-close]');
    if (close) return closeSession(close.dataset.doClose);
    if (e.target.closest('.ask, .rename-box')) return;
    const r = e.target.closest('.row[data-job]');
    if (r) openRow(r);
  });
  $('list').addEventListener('keydown', (e) => {
    if (e.target.matches('[data-rename-input]') && e.key === 'Enter') { e.preventDefault(); return saveRename(); }
    const r = e.target.closest('.row[data-job]');
    if (r && e.target === r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openRow(r); }
  });
  $('list').addEventListener('input', (e) => { if (e.target.matches('[data-rename-input]')) renaming.value = e.target.value; });

  function closeMenu() { $('menu').hidden = true; $('menu-btn').setAttribute('aria-expanded', 'false'); }
  $('menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const m = $('menu');
    m.hidden = !m.hidden;
    $('menu-btn').setAttribute('aria-expanded', String(!m.hidden));
    document.querySelectorAll('input[name=mode]').forEach((r) => { r.checked = r.value === mode; });
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) closeMenu(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    closeMenu();
    if (confirming || renaming) { confirming = null; renaming = null; redraw(); }
    if (document.activeElement === $('prompt')) $('prompt').blur();
  });
  document.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', () => { mode = r.value; save('mode', mode); redraw(); }));

  // New session: the box is always there. Typing in it brings up where it starts and Start; Enter
  // starts it and Shift+Enter is a new line, as in Claude Code's own prompt. Claude Code names the
  // session from its first message, and Rename changes that later. It joins the list without taking
  // over the Sessions tab — you may be typing in the session it would replace.
  const compose = $('compose');
  const prompt = $('prompt');
  let pictures = [];
  // The draft is kept as you type: the page reloads itself whenever the panel restarts or this file
  // changes, and the box used to come back empty. Starting the session clears it; the folder stays.
  const draft = load('draft', {});
  function keepDraft(extra) { save('draft', { text: prompt.value, pictures, folder: $('folder').value || draft.folder, ...extra }); }
  function grow() { prompt.style.height = 'auto'; prompt.style.height = `${Math.min(prompt.scrollHeight, 168)}px`; }
  function syncCompose() {
    compose.classList.toggle('open', !!prompt.value.trim() || pictures.length > 0 || compose.contains(document.activeElement));
    $('start').disabled = !prompt.value.trim() || compose.classList.contains('starting');
  }
  prompt.addEventListener('input', () => { grow(); $('msg').textContent = ''; syncCompose(); keepDraft(); });
  $('folder').addEventListener('change', () => keepDraft());
  compose.addEventListener('focusin', syncCompose);
  compose.addEventListener('focusout', () => setTimeout(syncCompose, 0));
  prompt.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey && !e.isComposing) { e.preventDefault(); if (!$('start').disabled) compose.requestSubmit(); }
  });
  compose.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('msg').textContent = '';
    compose.classList.add('starting'); $('start').textContent = 'Starting…'; syncCompose();
    try {
      const res = await post('/api/new', { prompt: prompt.value, folder: $('folder').value, pictures });
      if (res.ok) { prompt.value = ''; pictures = []; drawPics(); grow(); prompt.blur(); }
      else $('msg').textContent = `Not started — ${res.message || res.error}`;
    } finally { compose.classList.remove('starting'); $('start').textContent = 'Start'; syncCompose(); tick(); }
  });

  // Pictures that go with the first message: the panel saves each one and puts its path in the message.
  function drawPics() {
    $('pics').innerHTML = pictures.map((n) => `<span class="pic"><img src="/pic/${esc(n)}" alt="Picture to send"><button type="button" data-unpic="${esc(n)}" aria-label="Remove picture" title="Remove">${SVG.x}</button></span>`).join('');
    syncCompose();
    keepDraft();
  }
  function addPics(names) { pictures = [...new Set([...pictures, ...(names || [])])]; drawPics(); }
  prompt.value = draft.text || '';
  pictures = draft.pictures || [];
  drawPics(); grow();
  // Only while the panel still has the keyboard: focus() would take it back from the terminal (see draw()).
  if (draft.caret && document.hasFocus()) { prompt.focus(); prompt.setSelectionRange(...draft.caret); }
  $('pics').addEventListener('click', (e) => {
    const b = e.target.closest('[data-unpic]');
    if (b) { pictures = pictures.filter((n) => n !== b.dataset.unpic); drawPics(); prompt.focus(); }
  });

  // ⌘V and the paste button read the Mac's clipboard through the panel: iTerm2's side panel can't paste
  // a picture itself. Text lands at the cursor; a picture joins New session's pictures.
  async function pasteInto(field) {
    const inCompose = field === prompt;
    const res = await post('/api/clipboard', {});
    if (!res.ok) { if (inCompose) $('msg').textContent = res.message || res.error; return; }
    if (inCompose) { $('msg').textContent = ''; addPics(res.pictures); }
    if (res.text) {
      field.setRangeText(res.text, field.selectionStart, field.selectionEnd, 'end');
      field.dispatchEvent(new Event('input', { bubbles: true }));
    }
    field.focus();
  }
  const pastable = (el) => el?.matches?.('input:not([type=radio]):not([type=checkbox]), textarea');
  document.addEventListener('keydown', (e) => {
    if (e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'v' && pastable(e.target)) { e.preventDefault(); pasteInto(e.target); }
  });
  document.addEventListener('paste', (e) => { if (pastable(e.target)) { e.preventDefault(); pasteInto(e.target); } });
  $('paste').addEventListener('click', () => pasteInto(prompt));

  // A picture dragged onto the panel goes with the next New session. Without this the panel would
  // load the dropped file in place of the list.
  const carriesFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  document.addEventListener('dragover', (e) => { if (carriesFiles(e)) { e.preventDefault(); compose.classList.add('open', 'drop'); } });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) { compose.classList.remove('drop'); syncCompose(); } });
  document.addEventListener('drop', async (e) => {
    if (!carriesFiles(e)) return;
    e.preventDefault();
    compose.classList.remove('drop');
    $('msg').textContent = '';
    for (const f of [...e.dataTransfer.files]) {
      if (!f.type.startsWith('image/')) { $('msg').textContent = `${f.name} isn't a picture`; continue; }
      const r = await fetch('/api/picture', { method: 'POST', headers: { 'Content-Type': f.type, 'X-Panel-Key': KEY }, body: f });
      const res = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
      if (res.ok) addPics(res.pictures); else $('msg').textContent = res.message || res.error;
    }
    prompt.focus();
  });

  tick();
  setInterval(tick, 2000);
</script>
</body>
</html>

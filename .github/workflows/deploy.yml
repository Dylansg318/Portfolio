name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first: a schema violation should fail here, not silently ship.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Secrets can't be used directly in an `if:`, so surface presence as an env
      # flag. Without this the deploy step fails on every push until Cloudflare
      # credentials exist, leaving CI permanently red for no reason.
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — build verified, deploy skipped."
          fi

      # Deploy only from main, and only once credentials exist.
      # PRs get build + typecheck as a gate.
      - name: Deploy to Cloudflare Workers
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name == 'push'
          && steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

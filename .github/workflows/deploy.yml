name: Deploy

on:
  # There is deliberately NO `push` trigger. Every push used to build here, which
  # at ~13 pushes/day was spending ~480 Actions minutes a month against a 2,000
  # allowance. The site now ships on demand from `scripts/deploy-from-mac.sh`,
  # which builds in a case-sensitive Linux container locally, for zero minutes
  # and in about the same wall-clock this runner took (81s vs 84s).
  #
  # What remains costs nothing in practice. Work lands straight on main, so
  # `pull_request` almost never fires — it is a free Linux-x64 net for the rare
  # PR. `workflow_dispatch` is the fallback for when the Mac is unavailable.
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first: a schema violation should fail here, not silently ship.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Secrets can't be used directly in an `if:`, so surface presence as an env
      # flag. Without this the deploy step fails on every push until Cloudflare
      # credentials exist, leaving CI permanently red for no reason.
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — build verified, deploy skipped."
          fi

      # Deploy only from main, only on a manual dispatch, and only once
      # credentials exist. This is now the FALLBACK path — the normal one is
      # `scripts/deploy-from-mac.sh`. Use it when the Mac is unavailable.
      # PRs still get build + typecheck as a gate, but never deploy.
      - name: Deploy to Cloudflare Workers
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name == 'workflow_dispatch'
          && steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

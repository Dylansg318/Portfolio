name: Deploy

on:
  # A push to main builds AND deploys. The `push` trigger was removed in Aug 2026
  # because ~13 pushes/day cost ~480 Actions minutes a month against a 2,000
  # allowance — billing rounds up to a whole minute per job, so a 50-second build
  # cost a full one. The repository went public on 2026-09-01, and GitHub does not
  # bill standard runners on public repositories, so that reason is gone: measured
  # on this repo's own runs, `billable.UBUNTU` is 0ms against a ~60s duration.
  #
  # The trade this re-accepts, deliberately: `git push` IS the deploy button.
  # Nothing prompts, nothing confirms. `scripts/deploy-from-mac.sh` is no longer
  # the normal path but still owns what a push cannot express — a non-main ref, a
  # redeploy with no new commit, gates run locally before pushing, or shipping
  # while Actions is degraded.
  #
  # `pull_request` stays a build-only gate. The repo is public, so anyone may open
  # one; the deploy step below excludes the event explicitly so a fork's PR has no
  # path to Cloudflare. `workflow_dispatch` redeploys current main on demand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref. Now that a
# run deploys, this also means a rapid second push cancels the first run's deploy
# — which is what you want: the newer commit wins the race, rather than an older
# build landing on top of it. Wrangler activates a version atomically, so a
# cancelled deploy either happened or did not; it cannot half-ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `cache: npm` stays explicit. setup-node v5 added automatic caching, but
      # only when package.json carries a `packageManager` field — this one does
      # not, so without this line there would be no cache at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same flags scripts/deploy-from-mac.sh already passes. `npm ci` reinstalls
      # from the lockfile either way; the audit report and the funding banner are
      # pure output, and `--prefer-offline` stops npm revalidating tarballs the
      # setup-node cache above just restored.
      - run: npm ci --no-audit --no-fund --prefer-offline

      # The gate and the build run TOGETHER, not one after the other. Nothing
      # here is weakened: the deploy step below still refuses to run unless the
      # typecheck passed. Only the ordering changed.
      #
      #   `wrangler types` regenerates the gitignored worker-configuration.d.ts
      #   that `astro check` reads. `astro build` reads neither — verified by
      #   deleting the file and building, which succeeds — so the build has no
      #   reason to queue behind them.
      #
      # Measured on run #25, the last sequential one: typecheck 13.0s + build 8.5s
      # = 21.5s of a 45s job. Overlapped, the foreground path (types ~2.9s + check
      # ~9.9s) is the long pole and the build finishes inside it.
      #
      # The order is load-bearing a second way: `wrangler types` delays `astro
      # check` by ~3s, which is long enough that the build's `astro sync` has
      # finished writing .astro/ before the check's own sync starts. Both commands
      # regenerate the same content types into the same directory, so do not
      # "simplify" this by launching the two Astro processes at the same instant.
      #
      # The build's output is buffered and replayed in a fold rather than streamed:
      # two processes interleaving into one log is unreadable, and a failed build
      # still has to be diagnosable from the run page.
      - name: Typecheck and build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm run build > "$RUNNER_TEMP/build.log" 2>&1 &
          build_pid=$!

          check_rc=0
          npm run cf:types && npm run check:astro && npm run check:contrast || check_rc=$?

          build_rc=0
          wait "$build_pid" || build_rc=$?

          echo "::group::astro build + pagefind"
          cat "$RUNNER_TEMP/build.log"
          echo "::endgroup::"

          [ "$check_rc" -eq 0 ] || { echo "::error::Typecheck failed — nothing was deployed."; exit "$check_rc"; }
          [ "$build_rc" -eq 0 ] || { echo "::error::Build failed — see the fold above."; exit "$build_rc"; }

      # Secrets can't be used directly in an `if:`, so surface presence as an env
      # flag. Without this the deploy step fails on every push until Cloudflare
      # credentials exist, leaving CI permanently red for no reason.
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — build verified, deploy skipped."
          fi

      # Deploy on any push to main, and on manual dispatch, once credentials
      # exist. `pull_request` is excluded by name rather than by inference: on
      # that event `github.ref` is the PR merge ref and would not match main
      # anyway, but this repository is public and a fork's PR must never have a
      # route to Cloudflare, so the condition says so out loud.
      - name: Deploy to Cloudflare Workers
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.cf.outputs.ready == 'true'
        #
        # `npm run cf:deploy` (= `wrangler deploy`), NOT cloudflare/wrangler-action.
        # The action's one real service was deciding which wrangler to run, and
        # this repo pins one in package.json that `npm ci` has already installed —
        # so on run #25 it spent 1.7s on `npx --no-install wrangler --version`
        # rediscovering a version we chose, plus an action download in job setup.
        # Calling the same npm script scripts/deploy-from-mac.sh calls also removes
        # the last place CI and the local path could drift apart.
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler phones home on every invocation unless told not to.
          WRANGLER_SEND_METRICS: "false"

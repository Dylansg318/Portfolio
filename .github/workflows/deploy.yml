name: Deploy

on:
  # A push to main builds AND deploys. The `push` trigger was removed in Aug 2026
  # because ~13 pushes/day cost ~480 Actions minutes a month against a 2,000
  # allowance — billing rounds up to a whole minute per job, so a 50-second build
  # cost a full one. The repository went public on 2026-09-01, and GitHub does not
  # bill standard runners on public repositories, so that reason is gone: measured
  # on this repo's own runs, `billable.UBUNTU` is 0ms against a ~60s duration.
  #
  # The trade this re-accepts, deliberately: `git push` IS the deploy button.
  # Nothing prompts, nothing confirms. `scripts/deploy-from-mac.sh` is no longer
  # the normal path but still owns what a push cannot express — a non-main ref, a
  # redeploy with no new commit, gates run locally before pushing, or shipping
  # while Actions is degraded.
  #
  # `pull_request` stays a build-only gate. The repo is public, so anyone may open
  # one; the deploy step below excludes the event explicitly so a fork's PR has no
  # path to Cloudflare. `workflow_dispatch` redeploys current main on demand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref. Now that a
# run deploys, this also means a rapid second push cancels the first run's deploy
# — which is what you want: the newer commit wins the race, rather than an older
# build landing on top of it. Wrangler activates a version atomically, so a
# cancelled deploy either happened or did not; it cannot half-ship.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `cache: npm` stays explicit. setup-node v5 added automatic caching, but
      # only when package.json carries a `packageManager` field — this one does
      # not, so without this line there would be no cache at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first: a schema violation should fail here, not silently ship.
      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Secrets can't be used directly in an `if:`, so surface presence as an env
      # flag. Without this the deploy step fails on every push until Cloudflare
      # credentials exist, leaving CI permanently red for no reason.
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — build verified, deploy skipped."
          fi

      # Deploy on any push to main, and on manual dispatch, once credentials
      # exist. `pull_request` is excluded by name rather than by inference: on
      # that event `github.ref` is the PR merge ref and would not match main
      # anyway, but this repository is public and a fork's PR must never have a
      # route to Cloudflare, so the condition says so out loud.
      - name: Deploy to Cloudflare Workers
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.cf.outputs.ready == 'true'
        # v4 changed the action's DEFAULT wrangler to v4, which does not apply
        # here: the action probes for an existing install first, and `npm ci`
        # above has already put this repo's pinned wrangler (4.127.1) on disk.
        # CI therefore deploys with the exact version `npx wrangler deploy` uses
        # in scripts/deploy-from-mac.sh, and a bump in package.json moves both.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
